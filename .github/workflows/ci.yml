name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    name: Backend (Java / JUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run tests
        run: ./mvnw verify

  python:
    name: Python engine (pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Syntax check
        run: python -m py_compile icepunk_midi_generator.py

      - name: Unit tests
        run: python -m pytest tests/ -m "not slow" -v --tb=short

      - name: Smoke tests (run generator, verify output)
        run: python -m pytest tests/ -m slow -v --tb=short
