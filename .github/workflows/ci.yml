# This workflow needs no repository secrets: the `docker` job only builds and scans
# the image locally (no registry push), and Newman/Playwright run against a
# docker-compose stack with local-only MinIO/Postgres credentials.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel superseded runs on the same branch/PR so only the latest push is tested.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java / JUnit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Ensure mvnw is executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
          if-no-files-found: ignore
          retention-days: 7

  python:
    name: Python engine (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Syntax check
        run: python -m py_compile generate_midi.py

      - name: Lint
        run: ruff check generate_midi.py tests/

      - name: Type check
        run: mypy generate_midi.py --strict

      - name: Unit tests
        run: python -m pytest tests/ -m "not slow" -v --tb=short --junit-xml=unit-results.xml

      - name: Smoke tests (run generator, verify output)
        run: python -m pytest tests/ -m slow -v --tb=short --junit-xml=smoke-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results
          path: |
            python/unit-results.xml
            python/smoke-results.xml

  frontend:
    name: Frontend (Jest / typecheck / lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Unit and component tests (with coverage)
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov-report
          retention-days: 7

  newman:
    name: API smoke test (Newman)
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure mvnw is executable
        run: chmod +x backend/mvnw

      - name: Start Postgres and MinIO
        run: docker compose up -d --wait

      - name: Provision the MinIO bucket
        run: |
          docker run --rm --network host \
            -e MC_HOST_local=http://minioadmin:minioadmin@localhost:9010 \
            minio/mc mb --ignore-existing local/icepunk-zips
          docker run --rm --network host \
            -e MC_HOST_local=http://minioadmin:minioadmin@localhost:9010 \
            minio/mc anonymous set download local/icepunk-zips

      - name: Set up the Python venv for the MIDI generator
        run: |
          python3 -m venv venv
          venv/bin/pip install -r python/requirements.txt

      - name: Start the backend
        working-directory: backend
        run: |
          nohup ./mvnw spring-boot:run > ../backend.log 2>&1 &
          echo $! > ../backend.pid

      - name: Wait for the backend to become healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/actuator/health > /dev/null; then
              echo "Backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy in time"
          cat backend.log
          exit 1

      - name: Run Newman
        run: |
          npx --yes newman run postman/icepunk.postman_collection.json \
            -e postman/ci.postman_environment.json \
            --reporters cli,junit \
            --reporter-junit-export newman-results.xml

      - name: Upload Newman results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-results
          path: newman-results.xml

      - name: Stop the backend and infra
        if: always()
        run: |
          if [ -f backend.pid ]; then kill "$(cat backend.pid)" || true; fi
          docker compose down

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Ensure mvnw is executable
        run: chmod +x backend/mvnw

      - name: Start Postgres and MinIO
        run: docker compose up -d --wait

      - name: Provision the MinIO bucket
        run: |
          docker run --rm --network host \
            -e MC_HOST_local=http://minioadmin:minioadmin@localhost:9010 \
            minio/mc mb --ignore-existing local/icepunk-zips
          docker run --rm --network host \
            -e MC_HOST_local=http://minioadmin:minioadmin@localhost:9010 \
            minio/mc anonymous set download local/icepunk-zips

      - name: Set up the Python venv for the MIDI generator
        run: |
          python3 -m venv venv
          venv/bin/pip install -r python/requirements.txt

      - name: Start the backend
        working-directory: backend
        run: |
          nohup ./mvnw spring-boot:run > ../backend.log 2>&1 &
          echo $! > ../backend.pid

      - name: Wait for the backend to become healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/actuator/health > /dev/null; then
              echo "Backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy in time"
          cat backend.log
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Playwright end-to-end tests
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8081
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Stop the backend and infra
        if: always()
        run: |
          if [ -f backend.pid ]; then kill "$(cat backend.pid)" || true; fi
          docker compose down

  docker:
    name: Docker build (backend image)
    runs-on: ubuntu-latest
    # The image itself only bundles backend + python code, but frontend is included
    # in `needs` too so the image never builds while any test suite is red.
    needs: [backend, frontend, python]
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Derive image tags (git SHA, branch, latest)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: icepunk-backend
          tags: |
            type=sha,prefix=,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image (loaded for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: icepunk-backend:${{ github.sha }}
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy image scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

  security:
    name: Security scan (Trivy filesystem)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Scan filesystem for vulnerable dependencies (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          skip-dirs: frontend/node_modules,venv

      - name: Upload Trivy filesystem scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs

  codeql:
    name: CodeQL analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [java, javascript, python]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        if: matrix.language == 'java'
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
