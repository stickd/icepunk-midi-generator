services:
  # These fixed credentials are deliberately local-development-only. Do not
  # copy them into .env.production or use this compose file for deployment.
  postgres:
    image: postgres:16
    container_name: icepunk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: icepunk
      POSTGRES_USER: icepunk
      POSTGRES_PASSWORD: icepunk_local_dev
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icepunk -d icepunk"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - icepunk-dev

  minio:
    image: minio/minio
    container_name: icepunk-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Presigned MinIO GET URLs are consumed by the browser. This is CORS
      # only; the bucket remains private and still requires a signature.
      MINIO_API_CORS_ALLOW_ORIGIN: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      MINIO_API_CORS_ALLOW_CREDENTIALS_WITH_WILDCARD: "off"
    ports:
      - "${MINIO_API_PORT:-9010}:9000"
      - "${MINIO_CONSOLE_PORT:-9011}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - icepunk-dev

  create-minio-bucket:
    image: minio/mc
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\";
      mc mb --ignore-existing local/\"$${S3_BUCKET}\";
      "
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      S3_BUCKET: icepunk-zips
    networks:
      - icepunk-dev

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: icepunk-backend
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      create-minio-bucket:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: 8081
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/icepunk
      SPRING_DATASOURCE_USERNAME: icepunk
      SPRING_DATASOURCE_PASSWORD: icepunk_local_dev
      JWT_SECRET: INSECURE-DEV-ONLY-replace-with-a-random-32-byte-secret
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      ICEPUNK_GENERATOR_PROJECT_DIR: /app
      ICEPUNK_GENERATOR_PYTHON_PATH: /app/venv/bin/python3
      ICEPUNK_GENERATOR_SCRIPT_NAME: python/generate_midi.py
      ICEPUNK_TEMP_ANALYZER_SCRIPT_NAME: python/temp_analyzer.py
      DATASETS_TEMP_DIR: /app/temp_analysis
      S3_ENDPOINT: http://minio:9000
      # Used only to build URLs consumed by the browser, never for backend I/O.
      S3_PRESIGN_ENDPOINT: ${S3_PRESIGN_ENDPOINT:-http://localhost:9010}
      S3_REGION: eu-central-1
      S3_BUCKET: icepunk-zips
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - icepunk-dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* values are compiled into the browser bundle. `backend`
        # is a Docker-only hostname and must not appear here.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081}
    container_name: icepunk-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - icepunk-dev

volumes:
  postgres_data:
  minio_data:

networks:
  icepunk-dev:
