services:
  postgres:
    image: postgres:16
    container_name: icepunk-postgres
    environment:
      POSTGRES_DB: icepunk
      POSTGRES_USER: icepunk
      POSTGRES_PASSWORD: icepunk
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: icepunk-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
