spring.application.name=backend
server.port=${SERVER_PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/icepunk}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:icepunk}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:icepunk}

jwt.secret=${JWT_SECRET:replace-with-at-least-32-random-characters}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

icepunk.generator.project-dir=${ICEPUNK_GENERATOR_PROJECT_DIR:${user.dir}/..}
icepunk.generator.python-path=${ICEPUNK_GENERATOR_PYTHON_PATH:${icepunk.generator.project-dir}/venv/bin/python3}
icepunk.generator.script-name=${ICEPUNK_GENERATOR_SCRIPT_NAME:icepunk_midi_generator.py}
icepunk.generator.timeout-seconds=${ICEPUNK_GENERATOR_TIMEOUT_SECONDS:60}
icepunk.generator.max-concurrent=${ICEPUNK_GENERATOR_MAX_CONCURRENT:2}

s3.endpoint=${S3_ENDPOINT:http://localhost:9010}
s3.region=${S3_REGION:eu-central-1}
s3.bucket=${S3_BUCKET:icepunk-zips}
s3.access-key=${S3_ACCESS_KEY:minioadmin}
s3.secret-key=${S3_SECRET_KEY:minioadmin}
s3.public-url=${S3_PUBLIC_URL:http://localhost:9010/icepunk-zips}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
