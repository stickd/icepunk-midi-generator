spring.application.name=backend
server.port=${SERVER_PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/icepunk}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:icepunk}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:icepunk_local_dev}

jwt.secret=${JWT_SECRET:INSECURE-DEV-ONLY-replace-with-a-random-32-byte-secret}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.proxy.trusted-proxies=${TRUSTED_PROXY_CIDRS:127.0.0.1/32,::1/128}

icepunk.generator.project-dir=${ICEPUNK_GENERATOR_PROJECT_DIR:${user.dir}/..}
icepunk.generator.python-path=${ICEPUNK_GENERATOR_PYTHON_PATH:}
icepunk.generator.script-name=${ICEPUNK_GENERATOR_SCRIPT_NAME:python/generate_midi.py}
icepunk.generator.temp-analyzer-script-name=${ICEPUNK_TEMP_ANALYZER_SCRIPT_NAME:python/temp_analyzer.py}
icepunk.generator.timeout-seconds=${ICEPUNK_GENERATOR_TIMEOUT_SECONDS:60}
icepunk.generator.max-concurrent=${ICEPUNK_GENERATOR_MAX_CONCURRENT:2}
generated.zip.retention-days=${GENERATED_ZIP_RETENTION_DAYS:2}
generated.pack.recovery.enabled=${GENERATED_PACK_RECOVERY_ENABLED:true}
generated.pack.recovery.fixed-delay-ms=${GENERATED_PACK_RECOVERY_FIXED_DELAY_MS:300000}
generated.pack.recovery.stale-after-minutes=${GENERATED_PACK_RECOVERY_STALE_AFTER_MINUTES:30}
generated.pack.recovery.batch-size=${GENERATED_PACK_RECOVERY_BATCH_SIZE:50}
datasets.temp.dir=${DATASETS_TEMP_DIR:${icepunk.generator.project-dir}/temp_analysis}
datasets.temp.midi.max-size-bytes=${DATASETS_TEMP_MIDI_MAX_SIZE_BYTES:2097152}
datasets.temp.retention-hours=${DATASETS_TEMP_RETENTION_HOURS:24}

uploads.midi.max-size-bytes=${UPLOADS_MIDI_MAX_SIZE_BYTES:2097152}
uploads.sample.max-size-bytes=${UPLOADS_SAMPLE_MAX_SIZE_BYTES:20971520}
spring.servlet.multipart.max-file-size=${UPLOADS_MULTIPART_MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${UPLOADS_MULTIPART_MAX_REQUEST_SIZE:220MB}
midi.limits.max-tracks=${MIDI_MAX_TRACKS:64}
midi.limits.max-events=${MIDI_MAX_EVENTS:100000}
midi.limits.max-notes=${MIDI_MAX_NOTES:50000}
midi.limits.max-ticks=${MIDI_MAX_TICKS:10000000}
midi.limits.max-duration-seconds=${MIDI_MAX_DURATION_SECONDS:3600}
midi.limits.max-tempo-changes=${MIDI_MAX_TEMPO_CHANGES:1000}

s3.endpoint=${S3_ENDPOINT:http://localhost:9010}
s3.presign-endpoint=${S3_PRESIGN_ENDPOINT:${s3.endpoint}}
s3.region=${S3_REGION:eu-central-1}
s3.bucket=${S3_BUCKET:icepunk-zips}
s3.access-key=${S3_ACCESS_KEY:minioadmin}
s3.secret-key=${S3_SECRET_KEY:minioadmin}
s3.connection-timeout-seconds=${S3_CONNECTION_TIMEOUT_SECONDS:3}
s3.socket-timeout-seconds=${S3_SOCKET_TIMEOUT_SECONDS:15}
s3.api-call-timeout-seconds=${S3_API_CALL_TIMEOUT_SECONDS:30}
s3.api-call-attempt-timeout-seconds=${S3_API_CALL_ATTEMPT_TIMEOUT_SECONDS:20}

storage.presigned.preview-ttl-seconds=${PRESIGNED_PREVIEW_TTL_SECONDS:600}
storage.presigned.download-ttl-seconds=${PRESIGNED_DOWNLOAD_TTL_SECONDS:180}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
