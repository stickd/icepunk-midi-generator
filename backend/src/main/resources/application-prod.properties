# No fallback: fail fast on startup rather than silently signing/verifying
# JWTs with the well-known placeholder default from application.properties.
jwt.secret=${JWT_SECRET}

spring.jpa.hibernate.ddl-auto=validate

# Flyway manages all schema changes in production.
# baseline-on-migrate is intentionally false: a fresh production database must
# have V1 applied cleanly; an existing database without flyway history will
# surface as a migration error that must be resolved explicitly.
spring.flyway.baseline-on-migrate=false

spring.jpa.show-sql=false

# Trust standard X-Forwarded-* headers from the production reverse proxy.
server.forward-headers-strategy=framework
app.proxy.trusted-proxies=${TRUSTED_PROXY_CIDRS:?TRUSTED_PROXY_CIDRS is required in production}

# API docs are not exposed publicly in production. Enabled only for local/dev.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
