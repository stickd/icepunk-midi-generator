spring.datasource.url=jdbc:h2:mem:icepunk_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

# Flyway disabled in tests: H2 schema is managed by Hibernate ddl-auto=create-drop
spring.flyway.enabled=false

# Suppress S3 connection attempts in tests
s3.endpoint=http://localhost:19999
s3.region=eu-central-1
s3.bucket=icepunk-zips-test
s3.access-key=test
s3.secret-key=test
s3.public-url=http://localhost:19999/icepunk-zips-test
s3.connection-timeout-seconds=3
s3.socket-timeout-seconds=15
s3.api-call-timeout-seconds=30
s3.api-call-attempt-timeout-seconds=20

# The test-classpath application.properties only sets spring.profiles.active=test,
# which shadows the main application.properties. So every placeholder the beans
# need must be defined here for the @SpringBootTest context to load.
jwt.secret=test-secret-at-least-32-characters-long-000
jwt.expiration=86400000

app.cors.allowed-origins=http://localhost:3000

icepunk.generator.project-dir=${user.dir}/..
icepunk.generator.python-path=python3
icepunk.generator.script-name=icepunk_midi_generator.py
icepunk.generator.timeout-seconds=60
icepunk.generator.max-concurrent=2
