spring.datasource.url=jdbc:h2:mem:icepunk_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

# Flyway disabled in tests: H2 schema is managed by Hibernate ddl-auto=create-drop
spring.flyway.enabled=false

# Suppress S3 connection attempts in tests
s3.endpoint=http://localhost:19999